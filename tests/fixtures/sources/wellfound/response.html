<!DOCTYPE html><html lang="en"><head><meta charSet="utf-8"/><title>Customer Success Specialist Jobs | Wellfound</title></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json" crossorigin="anonymous">{"props": {"pageProps": {"page": null, "role": "customer-success-specialist", "apolloState": {"data": {"ROOT_QUERY": {"__typename": "Query", "talent": {"__typename": "Talent", "seoLandingPageJobSearchResults({\"page\":1,\"role\":\"customer-success-specialist\"})": {"__typename": "Results", "totalStartupCount": 202, "totalJobCount": 335, "perPage": 20, "pageCount": 11, "startups": [{"__ref": "StartupResult:8170167"}, {"__ref": "StartupResult:792185"}]}}}, "StartupResult:8170167": {"__typename": "StartupResult", "id": "8170167", "badges": [{"__ref": "Badge:ACTIVELY_HIRING"}, {"__ref": "Badge:COMPANY_STAGE-8170167"}], "companySize": "SIZE_11_50", "highConcept": "D2C SuperApp for brands to perform all their operations from a single place", "highlightedJobListings": [{"__ref": "JobListingSearchResult:1716423"}], "logoUrl": "https://photos.wellfound.com/startups/i/8170167-0d5896c800f5ccb979b2f570028054d8-medium_jpg.jpg?buster=1653634569", "name": "Pragma (formerly Logisy)", "slug": "logisy"}, "Badge:ACTIVELY_HIRING": {"__typename": "Badge", "id": "ACTIVELY_HIRING", "name": "ACTIVELY_HIRING_BADGE", "label": "Actively Hiring", "tooltip": "Actively processing applications", "avatarUrl": null, "rating": null, "data": null}, "Badge:COMPANY_STAGE-8170167": {"__typename": "Badge", "id": "COMPANY_STAGE-8170167", "name": "COMPANY_STAGE_BADGE", "label": "Early Stage", "tooltip": "Startup in initial stages", "avatarUrl": null, "rating": null, "data": "early_stage"}, "StartupResult:792185": {"__typename": "StartupResult", "id": "792185", "badges": [{"__ref": "Badge:ACTIVELY_HIRING"}, {"__ref": "Badge:B2B-792185"}, {"__ref": "Badge:COMPANY_STAGE-792185"}, {"__ref": "Badge:GROWING_FAST-792185"}], "companySize": "SIZE_11_50", "highConcept": "Healthcare communication is broken. We're fixing it with AI", "highlightedJobListings": [{"__ref": "JobListingSearchResult:4829861"}, {"__ref": "JobListingSearchResult:3886599"}], "logoUrl": "https://photos.wellfound.com/startups/i/792185-32ef24153cbc41245c30924827ce065d-medium_jpg.jpg?buster=1586134958", "name": "Medsender", "slug": "medsender"}, "Badge:B2B-792185": {"__typename": "Badge", "id": "B2B-792185", "name": "B2B_BADGE", "label": "B2B", "tooltip": null, "avatarUrl": null, "rating": null, "data": null}, "Badge:COMPANY_STAGE-792185": {"__typename": "Badge", "id": "COMPANY_STAGE-792185", "name": "COMPANY_STAGE_BADGE", "label": "Early Stage", "tooltip": "Startup in initial stages", "avatarUrl": null, "rating": null, "data": "early_stage"}, "Badge:GROWING_FAST-792185": {"__typename": "Badge", "id": "GROWING_FAST-792185", "name": "GROWING_FAST_BADGE", "label": "Growing fast", "tooltip": "Showed strong hiring growth in the past month", "avatarUrl": null, "rating": null, "data": null}, "JobListingSearchResult:1716423": {"__typename": "JobListingSearchResult", "autoPosted": false, "atsSource": null, "description": "### Key Result Areas of our Ideal Candidate### \n\n**First and Foremost: **\n\n* Facilitating the successful onboarding of new customers and diligently walking them through the platform and its various features *\n* Resolve queries from customers effectively and in the shortest time possible \n* Prioritise among customer tickets &amp; queries keeping the best interest of the company in mind\n* Create and cultivate deep and meaningful relationships with our customers and build their loyalty towards Pragma\n* Become the face of Pragma for our clients and become the go-to person of contact\n* Get their feedback and be the voice of the customer in relevant decision junctions to improve our products\n* Own overall relationship with assigned clients, which includes managing on-boarding, implementation, training, increasing adoption, ensuring retention, and high levels of customer satisfaction\n* Train clients in possibilities and use-cases needed for successful adoption of Pragma’s dashboards, which includes creating written &amp; recorded content for customer-facing education \n* Collaborate with subject matter experts and product teams across the organisation to be familiar with and review all use cases for our institutional target base.\n* Assessing customer requirements, solving problems, anticipating future needs, and generally serving as the customers’ voice within Pragma\n\n\n**Desired Skills**\n* Minimum of 1-2 years experience in communications, account management, sales, or customer success\n* Strong verbal and written communication, and project management skills\n* Analytical and data-driven decision making\n* Comfortable working across multiple departments in a deadline-driven environment\n* Adaptive to changing priorities \n* An eye for detail, but is pragmatic and able to get things done fast\n\n**Awesome if**\n* You enjoy being in contact with clients, and a great problem solver \n* You are a great listener, and you are willing to learn and improve, both personally and professionally \n* You are quick-witted and able to think on your feet \n \n**Why join Pragma?**\n*  We believe that in the long-term, people over profits and prioritize culture over everything else\n*  Freedom and Responsibility\n*  Exponential Growth\n*  Young and fun working environment\n*  Best compensation options in the industry\n\n**We would love to have you on board as soon as possible. Folks who are available immediately or can join us by 1-2 weeks are most preferred.**\n\n*Have a longer notice period? Don’t hesitate to apply and talk to us :)*", "jobType": "full-time", "liveStartAt": 1790170092, "locationNames": ["Bengaluru", "Bengaluru"], "primaryRoleTitle": "Customer Success Manager", "remote": false, "remoteConfig": {"__typename": "JobListingRemoteConfig", "kind": "ONSITE", "wfhFlexible": false}, "acceptedRemoteLocationNames": [], "slug": "customer-success-specialist", "title": "Customer Success Specialist", "compensation": "₹30,000 – ₹50,000", "yearsExperienceMin": 1, "yearsExperienceMax": null, "id": "1716423", "isBookmarked": false}, "JobListingSearchResult:4829861": {"__typename": "JobListingSearchResult", "autoPosted": false, "atsSource": "AtsIntegration::Ashby::Listing", "description": "## About Medsender\n\nMedical practices run on paperwork. Referrals still arrive by fax, and patients wait while staff retype what a machine already knows. Medsender exists to take that work off their plate. Our mission is to automate administrative work for healthcare providers so patients get the care they need faster.\n\nWe started with fax, the unglamorous protocol that still carries most of the documents moving between practices. That wedge became a platform. Today Medsender reads and routes the documents flowing into a practice, writes what it finds back into the EHR, and works the referrals that come out of them, and MAIRA, our voice AI, picks up the phone calls a front desk never gets to. Thousands of providers in all fifty states run on it, and in the past year it saved them more than 2 million hours.\n\nWe're a lean team backed by Ballast Point Partners, and we've made the Inc. 5000 two years running. Healthcare is one of the few places left where good software changes what a workday feels like for the people doing the work, and most of that work is still undone. If you want real ownership and a short distance between your decision and its effect, we'd like to talk.\n\n## Why this role, now\n\nOur customers expand. Net revenue retention is comfortably above 100%, and practices that start with one product buy the next. As we continue to scale, every dollar that churns has to be replaced by a new logo before we grow.\n\nToday success, implementation, and support each do good work and each report separately. No one owns the arc from signed contract to renewal, no one owns the churn number, and no one can tell you from a dashboard which accounts are at risk next quarter. This is the hire that fixes that.\n\nYou will own customer success, implementation, and support, and you will carry gross and net retention as your number.\n\n## What you'll own\n\n**Retention.** Diagnose where churn concentrates: practice size, EHR, product line, onboarding cohort, tenure. Build the health scoring and account coverage model that surfaces risk early. Move the GRR number and be able to say why it moved.\n\n**Expansion.** Protect the expansion motion that works today and make it systematic: which products follow which, when to introduce them, and who makes the ask. Partner with sales on hand-offs for expansion deals large enough to need an AE.\n\n**Time to value.** Implementation runs well today under a strong director. Your job is to make it measurable, set a time-to-value target by segment, and connect onboarding quality to first-year retention so we can see which shortcuts cost us later.\n\n**Support that scales sub-linearly.** Own responsiveness and quality, and build the deflection layer: documentation, in-product guidance, and AI-assisted triage. Headcount should not scale one-for-one with customers.\n\n**The customer journey.** Define the stages from contract to renewal, put an owner on each hand-off, and make the customer experience one company rather than three teams.\n\n**The voice of the customer.** Get what customers actually do, not what they ask for, into product on a predictable rhythm. Supply the references and performance data our analyst relations and case study programs need.\n\n**The team.** You inherit a Director of Implementation, a Customer Success Lead, an Implementation Specialist, and a Support Specialist. Assess, develop, and structure the team for a book that doubles. Hire as the book grows.\n\n## What success looks like\n\n• **90 days.** You know the book account by account. You have a churn diagnosis with numbers behind it, a point of view on team structure and staffing, and the three metrics we should run on.\n\n• **6 months.** Health scoring live and trusted by sales and leadership. A documented journey with owners at each stage. A time-to-value baseline by segment. First changes to onboarding or coverage shipped, with a hypothesis about what they will do to GRR.\n\n• **12 months.** GRR measurably up. NRR held or better. A team that is clearly structured and growing. Customer insight reaching product on a cadence they rely on.\n\n## What we're looking for\n\n• 7+ years in customer success or customer operations, including 3+ years managing across more than one function.\n\n• Has owned a gross retention number and moved it. Can name the rate they inherited, where it went, and what they changed.\n\n• Has run or worked alongside implementation closely enough to know what a bad onboarding looks like six months later.\n\n• Operates at SMB scale: a book of hundreds of accounts with small ACVs, where coverage is a model and not a named-account list.\n\n• Hands-on with CRM and customer data. Builds the first version of health scoring themselves.\n\n• A manager who develops people and makes hard calls about structure.\n\n• Healthcare or health-tech strongly preferred: practice workflows, EHR integrations, HIPAA.\n\n## Nice to have\n\n• AI-enabled products and setting customer expectations around them.\n\n• Support tooling and deflection at scale.\n\n• Has carried an expansion quota or managed people who did.\n\n• HubSpot experience.\n\n## Logistics\n\n• Location: Remote US or New York.\n\n• Reports to the CEO.\n\n• Benefits: Health, dental, and vision. Unlimited PTO, and people use it. Regular company offsites.\n\n", "jobType": "full-time", "liveStartAt": 1791934783, "locationNames": ["United States", "New York"], "primaryRoleTitle": "Customer Success Manager", "remote": true, "remoteConfig": null, "acceptedRemoteLocationNames": ["United States"], "slug": "head-of-customer-success", "title": "Head of Customer Success", "compensation": "$155k – $190k", "yearsExperienceMin": null, "yearsExperienceMax": null, "id": "4829861", "isBookmarked": false}, "JobListingSearchResult:3886599": {"__typename": "JobListingSearchResult", "autoPosted": false, "atsSource": "AtsIntegration::Ashby::Listing", "description": "## **Position Overview**\n\nWe’re seeking a **Customer Support Specialist** to own frontline (L1) support for Medsender. You’ll help customers navigate workflows, resolve common issues, and triage product bugs for escalation—while improving documentation and support operations over time. This is a **full-time, salaried (40 hrs/week)** position and a great fit for someone who is proactive, detail-oriented, and excited to learn quickly in a fast-moving startup environment.\n\nThis role is **not** a call-center environment. It’s a high-ownership position with close collaboration across Product and Engineering, and strong growth potential over time.\n\n## **Pivotal Responsibilities**\n\n- **Own the support queue (L1):** Respond to customer questions and issues with urgency, clarity, and empathy via email/chat (and occasional Zoom as needed).\n- **Troubleshoot and resolve issues:** Guide customers step-by-step through Medsender workflows, identify user errors vs. product bugs, and deliver practical solutions or workarounds.\n- **Escalate effectively to Engineering/Product:** When an issue requires deeper investigation, escalate with high-quality detail (clear repro steps, screenshots/context, expected vs. actual behavior, customer impact, and priority).\n- **Support onboarding and training (as needed):** Help new users become confident in Medsender through lightweight walkthroughs and best practices.\n- **Improve documentation and self-serve resources:** Create and maintain help articles, internal runbooks, templates, and macros to reduce repeat questions and speed up resolution.\n- **Contribute to support operations:** Help refine tagging, routing, escalation paths, and simple reporting on trends (top issues, recurring bugs, feature gaps).\n- **Operate in a HIPAA-aware environment:** Handle sensitive information appropriately and follow minimum-necessary practices.\n\n## **Essential Qualifications**\n\n- **Excellent written communication** and strong customer empathy—you can explain things clearly and calmly.\n- **Strong attention to detail** and a structured approach to problem-solving.\n- **High ownership and follow-through:** you take responsibility for driving issues to resolution.\n- **Comfort learning new software quickly** and adapting as the product evolves.\n- Prior customer-facing experience (support, operations, campus role, hospitality/retail, internships) is a plus, but **we welcome exceptional new grads** with evidence of grit, organization, and fast learning.\n\n## **Bonus Points**\n\n- Comfort with basic technical concepts like APIs/webhooks, browser troubleshooting, or reading logs (not required).\n- Experience supporting a SaaS product, onboarding/training users, or working in healthcare workflows.\n\n## **Why You Should Choose Medsender**\n\n- Work on a product customers rely on daily—and see your impact immediately.\n- Join a team that values speed, clarity, and strong execution.\n- Learn quickly in a high-growth environment with meaningful ownership.\n- Competitive compensation, benefits, and a flexible work environment.\n- Clear growth paths over time into Support Ops, Customer Success, Implementations, or more technical support roles.\n\n", "jobType": "full-time", "liveStartAt": 1771548123, "locationNames": ["United States", "New York"], "primaryRoleTitle": "Customer Service", "remote": false, "remoteConfig": null, "acceptedRemoteLocationNames": [], "slug": "customer-support-specialist", "title": "Customer Support Specialist", "compensation": "$60k – $80k", "yearsExperienceMin": null, "yearsExperienceMax": null, "id": "3886599", "isBookmarked": false}}}}}, "page": "/seoLanding/roleSearch", "query": {"role": "customer-success-specialist"}}</script></body></html>
